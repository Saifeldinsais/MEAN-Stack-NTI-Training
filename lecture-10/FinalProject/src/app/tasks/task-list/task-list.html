<h2 class="page-title">Task List</h2>
<button (click)="goToTaskForm()" class="add-task-btn"> Add Task </button>

<div class="task-grid">
  @for (task of tasks; track task._id; let i = $index) {
  <div class="task-container">
    <div class="task-header">
      <div class="task-title"><strong>{{task.title}}</strong></div>
      <div class="task-priority"><strong>Priority</strong></div>
      <div class="task-status"><strong>Status</strong></div>
    </div>
    <div class="task-body">
      <div class="task-image">
        <img [src]="task.coverImage ? 'http://localhost:5000/uploads/tasks/' + task.coverImage : 'assets/task-default.jpg'"
          alt="{{ task.title }}" class="task-img" />
        <!-- <img [src]="../../assets/task-default.jpg" alt="task-default"> -->
      </div>
      <div class="task-details"></div>
    </div>

    <button type="button" (click)="taskDetail(task._id)">Task Details</button>
  </div>
  }
</div>
