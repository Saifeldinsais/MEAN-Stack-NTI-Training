<section class="container" [class.touched-form]="loginForm.touched">
    <header>Log in to TaskTrace!</header>

    <form class="form" #loginForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="input-box">
            <input type="email" placeholder="Email" name="email" ngModel required #emailRef="ngModel" required
                email />
        </div>
        @if(emailRef.invalid && emailRef.touched){
        <div>
            <small>*Valid Email is required</small>
        </div>
        }

        <div class="input-box">
            <input type="password" placeholder="Password" name="password" ngModel required #passwordRef="ngModel" required
                minlength="8" />
        </div>
        @if(passwordRef.invalid && passwordRef.touched){
        <div>
            <small>*Please enter you password</small>
        </div>
        }


        <input type="submit" value="Submit Application" class="submit-btn" [disabled]="!loginForm.valid"
            [style.backgroundColor]="!loginForm.valid? 'gray' : '#007bff'" />
    </form>
</section>
